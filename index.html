  <!-- Tipografia: Geist (grotesca neutra, pesos 300–600) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/styles.css">

  <!-- Dados estruturados -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Mayra Portes",
    "jobTitle": "Product Designer",
    "url": "https://mayraportes2.github.io/portfolio/",
    "email": "mailto:mayraportes2@gmail.com",
    "telephone": "+55-31-98784-1714",

<body>
  <a class="skip-link" href="#main" data-i18n="skipLink">Pular para o conteúdo</a>

  <!--
    ESTRUTURA DO APP
    O conteúdo de cada tela é renderizado por js/app.js a partir de js/content.js.
    Para alterar textos, imagens e links, edite somente js/content.js.
  -->
  <div class="app" id="app">
    <!-- Barra superior: nome, menu e cidade/horário -->
    <header class="site-header" id="site-header"></header>

    <main class="screens" id="main" tabindex="-1">
      <section class="screen screen--home" id="home" data-screen tabindex="-1" aria-label="Início" data-i18n-aria="home"></section>
      <section class="screen" id="projects" data-screen tabindex="-1" aria-labelledby="projects-title"></section>
      <section class="screen" id="journey" data-screen tabindex="-1" aria-labelledby="journey-title"></section>
      <section class="screen" id="skills" data-screen tabindex="-1" aria-labelledby="skills-title"></section>
      <section class="screen screen--contact" id="contact" data-screen tabindex="-1" aria-labelledby="contact-title"></section>

      <noscript>
        <p class="noscript" data-i18n="noscript">Este portfólio é interativo e precisa de JavaScript. Contato: mayraportes2@gmail.com · +55 31 98784-1714</p>
      </noscript>
    </main>
  </div>

  <!-- Página interna dos cases (abre sobre o app) -->
  <div class="case-layer" id="case-layer" role="dialog" aria-modal="true" aria-labelledby="case-title" hidden>
    <div class="case-backdrop" data-close-case></div>
    <div class="case-sheet">
      <header class="case-bar">
        <button class="icon-btn case-close" type="button" data-close-case aria-label="Fechar case e voltar aos projetos" data-i18n-aria="closeCase">
          <i data-lucide="arrow-left" class="icon" aria-hidden="true"></i>
        </button>
        <span class="case-bar__title"><span>Case</span><strong id="case-bar-title"></strong></span>
        <div class="case-lang" id="case-lang"></div>
        <button class="icon-btn icon-btn--sm case-x" type="button" data-close-case aria-label="Fechar" data-i18n-aria="close">
          <i data-lucide="x" class="icon" aria-hidden="true"></i>
        </button>
        <span class="case-bar__progress" aria-hidden="true"><span id="case-progress"></span></span>
      </header>
      <div class="case-scroll" id="case-scroll"></div>
    </div>
  </div>

  <!-- Visualização ampliada de imagens dos cases -->
  <dialog class="lightbox" id="lightbox" aria-label="Imagem ampliada" data-i18n-aria="enlargedImage">
    <div class="lightbox__bar">
      <p class="lightbox__caption" id="lightbox-caption"></p>
      <button class="icon-btn icon-btn--sm" type="button" data-lightbox="zoom" aria-label="Alternar zoom" data-i18n-aria="toggleZoom" aria-pressed="false">
        <i data-lucide="zoom-in" class="icon" aria-hidden="true"></i>
      </button>
      <button class="icon-btn icon-btn--sm" type="button" data-lightbox="close" aria-label="Fechar imagem" data-i18n-aria="closeImage">
        <i data-lucide="x" class="icon" aria-hidden="true"></i>
      </button>
    </div>
    <div class="lightbox__stage" id="lightbox-stage"><img id="lightbox-img" src="" alt=""></div>
  </dialog>

  <!-- Notificações -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- Scripts (ordem importa): ícones → conteúdo → componentes → app -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <script src="js/content.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
